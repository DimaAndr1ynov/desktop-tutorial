name: Fetch card images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p assets/cards
          fetch() {
            curl -sSL --fail -o "assets/cards/$1" "https://images.unsplash.com/$2?auto=format&fit=crop&w=1000&q=78"
            file "assets/cards/$1" | grep -qi 'image' || (echo "$1 is not an image" && exit 1)
          }
          fetch stories.jpg  photo-1529774848151-535301a504f7
          fetch school.jpg   photo-1551524559-8af4e6624178
          fetch resort.jpg   photo-1616429553002-faf23468952d
          fetch freeride.jpg photo-1646297226339-febd1eaee532
          fetch events.jpg   photo-1582048551464-8b1d42010271
          fetch pf-resort.jpg photo-1551698618-1dfe5d97d256
          fetch pf-tour.jpg   photo-1551632811-561732d1e306
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git commit -m "Add local copies of service and portfolio card images"
          git push
